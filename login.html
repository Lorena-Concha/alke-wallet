<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alke Wallet — Iniciar Sesión</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
    }
    .logo-circle {
      width: 64px; height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;
      margin: 0 auto 24px;
      box-shadow: 0 8px 24px rgba(0,229,255,0.3);
    }
    .login-title {
      font-size: 1.7rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 6px;
    }
    .login-sub {
      text-align: center;
      color: var(--text2);
      font-size: 0.88rem;
      margin-bottom: 28px;
    }
    .demo-hint {
      background: rgba(0,229,255,0.06);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.8rem;
      color: var(--text2);
      margin-top: 16px;
    }
    .demo-hint strong { color: var(--accent); }
    .eye-btn {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--text2); cursor: pointer;
      font-size: 1rem; padding: 4px;
    }
    .pw-wrap { position: relative; }
  </style>
</head>
<body>
  <div class="bg-pattern"></div>
  <div class="page-wrap">
    <div class="login-wrap">
      <div class="login-card slide-up">
        <div class="alke-card">
          <div class="logo-circle">AW</div>
          <h1 class="login-title">Bienvenido</h1>
          <p class="login-sub">Iniciá sesión en tu wallet digital</p>

          <div id="alert-login" class="alke-alert error"></div>

          <form id="login-form" novalidate>
            <div class="form-group">
              <label class="alke-label" for="email">Correo electrónico</label>
              <input type="email" id="email" class="alke-input" placeholder="tu@email.com" required autocomplete="email">
            </div>

            <div class="form-group">
              <label class="alke-label" for="password">Contraseña</label>
              <div class="pw-wrap">
                <input type="password" id="password" class="alke-input" placeholder="••••••••" required autocomplete="current-password" style="padding-right:44px;">
                <button type="button" class="eye-btn" id="toggle-pw" title="Mostrar contraseña">👁</button>
              </div>
            </div>

            <button type="submit" class="btn-alke" id="btn-login">
              Iniciar sesión
            </button>
          </form>

          <div class="demo-hint">
            <strong>Demo:</strong> maria@alkemy.com / 123456<br>
            <strong>Demo:</strong> carlos@alkemy.com / password
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Si ya hay sesión, redirigir
    if (AlkeWallet.getSession()) window.location.href = 'menu.html';

    // Toggle password
    $('#toggle-pw').on('click', function() {
      const pw = $('#password');
      const isText = pw.attr('type') === 'text';
      pw.attr('type', isText ? 'password' : 'text');
      $(this).text(isText ? '👁' : '🙈');
    });

    // Submit login
    $('#login-form').on('submit', function(e) {
      e.preventDefault();
      const email    = $('#email').val().trim().toLowerCase();
      const password = $('#password').val();
      const btn      = $('#btn-login');

      // Validaciones
      if (!email || !password) {
        showAlert('alert-login', 'Por favor completá todos los campos.', 'error');
        return;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showAlert('alert-login', 'El correo electrónico no es válido.', 'error');
        return;
      }

      // Simular carga
      btn.html('<span class="spinner"></span>').prop('disabled', true);

      setTimeout(() => {
        const user = AlkeWallet.users.find(u => u.email === email && u.password === password);
        if (user) {
          AlkeWallet.setSession(user);
          // Inicializar saldo si no existe
          if (!localStorage.getItem('alke_balance')) {
            AlkeWallet.setBalance(user.balance);
          }
          showAlert('alert-login', '¡Bienvenido de nuevo, ' + user.name.split(' ')[0] + '!', 'success');
          setTimeout(() => window.location.href = 'menu.html', 800);
        } else {
          btn.html('Iniciar sesión').prop('disabled', false);
          showAlert('alert-login', 'Correo o contraseña incorrectos.', 'error');
          // Shake animation
          $('#login-form').css('animation', 'none');
          setTimeout(() => $('#login-form').css('animation', ''), 10);
        }
      }, 900);
    });
  </script>
</body>
</html>
