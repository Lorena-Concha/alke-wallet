<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alke Wallet — Enviar Dinero</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .contact-list {
      display: flex; flex-direction: column; gap: 6px;
      max-height: 220px; overflow-y: auto;
    }
    .contact-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: all 0.2s;
    }
    .contact-item:hover { background: var(--card2); border-color: var(--border); }
    .contact-item.selected { border-color: var(--accent); background: rgba(0,229,255,0.06); }
    .contact-avatar {
      width: 38px; height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, #1e3a5f, #2d4a7a);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Syne',sans-serif;
      font-weight: 700; font-size: 0.78rem;
      color: var(--accent);
      flex-shrink: 0;
    }
    .contact-name { font-weight: 500; font-size: .9rem; }
    .contact-email { font-size: .76rem; color: var(--text2); }
    .autocomplete-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-top: 4px;
      display: none;
      max-height: 180px;
      overflow-y: auto;
      box-shadow: var(--shadow);
    }
    .autocomplete-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: .88rem;
      transition: background 0.15s;
    }
    .autocomplete-item:hover { background: var(--card2); }
    .selected-contact-badge {
      display: none;
      background: rgba(0,229,255,0.08);
      border: 1px solid var(--accent);
      border-radius: 10px;
      padding: 10px 14px;
      margin-top: 8px;
      align-items: center;
      gap: 10px;
    }
    .step-circle {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--bg);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Syne',sans-serif;
      font-weight: 700; font-size: .8rem;
      flex-shrink: 0;
    }
    .step-title { font-weight: 600; font-size: .9rem; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  </style>
</head>
<body>
  <div class="bg-pattern"></div>
  <div class="page-wrap">

    <nav class="navbar navbar-alke navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand brand" href="menu.html">Alke<span>Wallet</span></a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
          <span style="color:var(--text)">☰</span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto align-items-center gap-1">
            <li class="nav-item"><a class="nav-link-alke" href="menu.html">🏠 Inicio</a></li>
            <li class="nav-item"><a class="nav-link-alke" href="deposit.html">💰 Depositar</a></li>
            <li class="nav-item"><a class="nav-link-alke active" href="sendmoney.html">📤 Enviar</a></li>
            <li class="nav-item"><a class="nav-link-alke" href="transactions.html">📋 Movimientos</a></li>
            <li class="nav-item ms-3">
              <button class="btn-alke btn-alke-outline" style="width:auto;padding:7px 16px;font-size:.85rem" onclick="logout()">Salir</button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container py-4">
      <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">

          <div class="mb-4 slide-up">
            <a href="menu.html" style="color:var(--text2);font-size:.85rem;text-decoration:none">← Volver</a>
            <h2 class="mt-2" style="font-size:1.6rem;font-weight:800">Enviar dinero</h2>
            <p style="color:var(--text2);font-size:.88rem">Transferí fondos a tus contactos</p>
          </div>

          <!-- Saldo disponible -->
          <div style="background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:20px" class="slide-up">
            <span style="font-size:.75rem;text-transform:uppercase;letter-spacing:1px;color:var(--text2)">Saldo disponible: </span>
            <strong style="font-family:'Syne',sans-serif;color:var(--accent)" id="balance-disp">$0</strong>
          </div>

          <div id="alert-send" class="alke-alert"></div>

          <!-- Paso 1: Contacto -->
          <div class="alke-card mb-3 slide-up">
            <div class="step-title">
              <div class="step-circle">1</div>
              Elegí un destinatario
            </div>

            <!-- Búsqueda con autocompletar jQuery -->
            <div class="form-group mb-0">
              <label class="alke-label" for="contact-search">Buscar contacto</label>
              <input type="text" id="contact-search" class="alke-input" placeholder="Nombre o email..." autocomplete="off">
              <div class="autocomplete-box" id="autocomplete-box"></div>
              <div class="selected-contact-badge" id="selected-badge">
                <div class="contact-avatar" id="sel-avatar">??</div>
                <div>
                  <div class="contact-name" id="sel-name"></div>
                  <div class="contact-email" id="sel-email"></div>
                </div>
                <button type="button" onclick="clearContact()" style="margin-left:auto;background:none;border:none;color:var(--text2);cursor:pointer;font-size:1rem">✕</button>
              </div>
            </div>

            <hr class="divider">

            <!-- Lista de contactos -->
            <div>
              <div style="font-size:.78rem;text-transform:uppercase;letter-spacing:.8px;color:var(--text2);margin-bottom:10px">Contactos frecuentes</div>
              <div class="contact-list" id="contacts-list"></div>
            </div>

            <!-- Agregar nuevo contacto -->
            <button class="btn-alke btn-alke-outline mt-3" style="font-size:.85rem;padding:10px" type="button" data-bs-toggle="collapse" data-bs-target="#new-contact-form">
              + Agregar nuevo contacto
            </button>
            <div class="collapse mt-3" id="new-contact-form">
              <div class="form-group">
                <label class="alke-label">Nombre completo</label>
                <input type="text" id="new-contact-name" class="alke-input" placeholder="Juan Rodríguez">
              </div>
              <div class="form-group">
                <label class="alke-label">Email</label>
                <input type="email" id="new-contact-email" class="alke-input" placeholder="juan@email.com">
              </div>
              <button class="btn-alke" style="background:var(--accent2);font-size:.85rem;padding:10px" onclick="addContact()">Guardar contacto</button>
            </div>
          </div>

          <!-- Paso 2: Monto y envío -->
          <div class="alke-card slide-up" id="step2-card" style="opacity:0.5;pointer-events:none">
            <div class="step-title">
              <div class="step-circle">2</div>
              Ingresá el monto
            </div>

            <form id="send-form" novalidate>
              <div class="form-group">
                <label class="alke-label" for="send-amount">Monto a enviar</label>
                <input type="number" id="send-amount" class="alke-input" placeholder="0.00" min="1" step="0.01">
              </div>
              <div class="form-group">
                <label class="alke-label" for="send-note">Nota (opcional)</label>
                <input type="text" id="send-note" class="alke-input" placeholder="Ej: Pago de alquiler">
              </div>
              <button type="submit" class="btn-alke" id="btn-send">
                📤 Confirmar envío
              </button>
            </form>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- Modal confirmación -->
  <div class="modal fade" id="confirmModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="background:var(--card);border:1px solid var(--border);border-radius:16px">
        <div class="modal-body p-4">
          <h5 style="font-family:'Syne',sans-serif;font-weight:700;margin-bottom:16px;text-align:center">Confirmar transferencia</h5>
          <div style="background:var(--card2);border-radius:12px;padding:16px;margin-bottom:16px">
            <div style="display:flex;justify-content:space-between;margin-bottom:8px">
              <span style="color:var(--text2);font-size:.85rem">Destinatario</span>
              <strong id="conf-name"></strong>
            </div>
            <div style="display:flex;justify-content:space-between;margin-bottom:8px">
              <span style="color:var(--text2);font-size:.85rem">Monto</span>
              <strong style="color:var(--red);font-family:'Syne',sans-serif" id="conf-amount"></strong>
            </div>
            <div style="display:flex;justify-content:space-between">
              <span style="color:var(--text2);font-size:.85rem">Nota</span>
              <span id="conf-note" style="font-size:.85rem"></span>
            </div>
          </div>
          <div class="d-flex gap-2">
            <button class="btn-alke btn-alke-outline" style="font-size:.85rem;padding:10px" data-bs-dismiss="modal">Cancelar</button>
            <button class="btn-alke btn-danger-alke" style="font-size:.85rem;padding:10px" id="btn-confirm-send">Confirmar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    requireAuth();
    let selectedContact = null;
    let contacts = [...AlkeWallet.contacts];

    // Mostrar saldo
    $('#balance-disp').text('$' + AlkeWallet.formatMoney(AlkeWallet.getBalance()));

    // Renderizar contactos
    function renderContacts(filter = '') {
      const filtered = contacts.filter(c =>
        c.name.toLowerCase().includes(filter.toLowerCase()) ||
        c.email.toLowerCase().includes(filter.toLowerCase())
      );
      let html = '';
      filtered.forEach(c => {
        html += `<div class="contact-item ${selectedContact && selectedContact.id===c.id?'selected':''}" onclick="selectContact(${c.id})">
          <div class="contact-avatar">${c.avatar}</div>
          <div>
            <div class="contact-name">${c.name}</div>
            <div class="contact-email">${c.email}</div>
          </div>
          ${selectedContact && selectedContact.id===c.id ? '<span style="margin-left:auto;color:var(--accent)">✓</span>' : ''}
        </div>`;
      });
      $('#contacts-list').html(html || '<p style="color:var(--text2);font-size:.85rem;padding:8px">Sin resultados</p>');
    }
    renderContacts();

    // Seleccionar contacto
    function selectContact(id) {
      selectedContact = contacts.find(c => c.id === id);
      renderContacts();
      // Mostrar badge
      $('#sel-avatar').text(selectedContact.avatar);
      $('#sel-name').text(selectedContact.name);
      $('#sel-email').text(selectedContact.email);
      $('#selected-badge').css('display', 'flex');
      $('#contact-search').val('');
      $('#autocomplete-box').hide();
      // Habilitar paso 2
      $('#step2-card').css({ opacity: 1, 'pointer-events': 'all' });
      $('html, body').animate({ scrollTop: $('#step2-card').offset().top - 80 }, 400);
    }

    // Limpiar contacto
    function clearContact() {
      selectedContact = null;
      $('#selected-badge').hide();
      $('#step2-card').css({ opacity: .5, 'pointer-events': 'none' });
      renderContacts();
    }

    // Autocompletar jQuery
    $('#contact-search').on('input', function() {
      const val = $(this).val().trim();
      if (!val) { $('#autocomplete-box').hide(); return; }
      const filtered = contacts.filter(c =>
        c.name.toLowerCase().includes(val.toLowerCase()) ||
        c.email.toLowerCase().includes(val.toLowerCase())
      );
      if (!filtered.length) { $('#autocomplete-box').hide(); return; }
      let html = '';
      filtered.forEach(c => {
        html += `<div class="autocomplete-item" onclick="selectContact(${c.id})">
          <div class="contact-avatar" style="width:30px;height:30px;font-size:.7rem">${c.avatar}</div>
          <div><strong style="font-size:.88rem">${c.name}</strong><br><span style="font-size:.75rem;color:var(--text2)">${c.email}</span></div>
        </div>`;
      });
      $('#autocomplete-box').html(html).show();
    });

    // Cerrar autocomplete al clickar afuera
    $(document).on('click', function(e) {
      if (!$(e.target).closest('#contact-search, #autocomplete-box').length) {
        $('#autocomplete-box').hide();
      }
    });

    // Agregar nuevo contacto
    function addContact() {
      const name  = $('#new-contact-name').val().trim();
      const email = $('#new-contact-email').val().trim();
      if (!name || !email) { showAlert('alert-send', 'Completá nombre y email del contacto.', 'error'); return; }
      const newContact = { id: Date.now(), name, email, avatar: name.split(' ').map(n=>n[0]).join('').substring(0,2).toUpperCase() };
      contacts.push(newContact);
      $('#new-contact-name, #new-contact-email').val('');
      new bootstrap.Collapse(document.getElementById('new-contact-form'), { toggle: true });
      renderContacts();
      selectContact(newContact.id);
      showAlert('alert-send', 'Contacto agregado correctamente.', 'success');
    }

    // Envío
    $('#send-form').on('submit', function(e) {
      e.preventDefault();
      const amount = parseFloat($('#send-amount').val());
      const note   = $('#send-note').val().trim();
      if (!selectedContact) { showAlert('alert-send', 'Seleccioná un destinatario.', 'error'); return; }
      if (!amount || amount <= 0) { showAlert('alert-send', 'Ingresá un monto válido.', 'error'); return; }
      if (amount > AlkeWallet.getBalance()) { showAlert('alert-send', 'Saldo insuficiente.', 'error'); return; }

      $('#conf-name').text(selectedContact.name);
      $('#conf-amount').text('-$' + AlkeWallet.formatMoney(amount));
      $('#conf-note').text(note || '—');
      new bootstrap.Modal(document.getElementById('confirmModal')).show();
    });

    // Confirmar envío
    $('#btn-confirm-send').on('click', function() {
      const amount = parseFloat($('#send-amount').val());
      const note   = $('#send-note').val().trim();
      const btn    = $(this);
      btn.html('<span class="spinner"></span>').prop('disabled', true);

      setTimeout(() => {
        const newBal = AlkeWallet.getBalance() - amount;
        AlkeWallet.setBalance(newBal);
        AlkeWallet.addTransaction({
          type: 'expense',
          name: selectedContact.name,
          amount: amount,
          category: 'Transferencia'
        });

        bootstrap.Modal.getInstance(document.getElementById('confirmModal')).hide();
        showAlert('alert-send', `✅ Enviaste $${AlkeWallet.formatMoney(amount)} a ${selectedContact.name}. Nuevo saldo: $${AlkeWallet.formatMoney(newBal)}`, 'success');
        $('#balance-disp').text('$' + AlkeWallet.formatMoney(newBal));
        $('#send-form')[0].reset();
        clearContact();
        btn.html('Confirmar').prop('disabled', false);
      }, 900);
    });
  </script>
</body>
</html>
